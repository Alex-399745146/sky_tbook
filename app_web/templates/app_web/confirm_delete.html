{% extends "base.html" %}

{% block title %}Удалить {{ object_type }} — Sky TBook{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="display-6 text-danger mb-2"><i class="bi bi-exclamation-triangle"></i></div>
                <h1 class="h3 mb-2">Удалить {{ object_type }}?</h1>
                <p class="text-body-secondary">
                    Вы собираетесь удалить {{ object_type }} <strong>«{{ object.name }}»</strong>.
                    Это действие нельзя отменить.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Удалить
                        </button>
                        <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
