# =============================================================================
# CI Pipeline — Continuous Integration
# =============================================================================
# Этот файл отвечает за автоматическую проверку качества кода.
# Запускается при каждом push и pull request.
#
# Что делает:
# 1. Проверяет код линтерами (black, isort, flake8, mypy)
# 2. Запускает тесты с измерением покрытия
# 3. Собирает Docker-image (для branch:  develop и main)
#
# Когда запускается:
# - При push в ветки develop, main или feature/*
# - При создании или обновлении pull request в develop или main
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# Триггеры — события, при которых запускается pipeline
# -----------------------------------------------------------------------------
on:
  # Запуск при push (git push) в указанные ветки
  push:
    branches:
      - develop           # Ветка для разработки новых фич
      - main              # Основная стабильная ветка
      - 'feature/**'      # Все ветки, начинающиеся с feature/

  # Запуск при pull request (создание, обновление коммитами, ревью)
  pull_request:
    branches:
      - develop    # Проверяем PR, которые мержат в develop
      - main       # Проверяем PR, которые мержат в main

# -----------------------------------------------------------------------------
# Jobs — набор задач, которые выполняются в pipeline
# -----------------------------------------------------------------------------
jobs:

  # ===========================================================================
  # JOB 1: LINT — Проверка кода линтерами
  # ===========================================================================
  # Эта задача проверяет стиль кода, форматирование, импорты и типы.
  # Запускается ПЕРВОЙ, потому что если код не проходит линтеры,
  # нет смысла запускать тесты.
  # ===========================================================================
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Poetry (менеджер зависимостей Python)
      - name: Install poetry
        run: pipx install poetry

      # Шаг 3: Настраиваем окружение Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Версия Python берётся из pyproject.toml (поле requires-python)
          python-version-file: 'pyproject.toml'
          # Кэшируем зависимости Poetry для ускорения последующих запусков
          cache: poetry

      # Шаг 4: Устанавливаем все зависимости проекта
      - name: Install dependencies
        run: poetry install

      # Шаг 5: Запускаем все линтеры
      - name: Run linters
        run: |
          # black — проверяет форматирование кода (отступы, пробелы, скобки)
          # --check — только проверка, без изменения файлов
          poetry run black --check .
          
          # isort — проверяет сортировку импортов
          # --check-only — только проверка, без изменения файлов
          poetry run isort --check-only .
          
          # flake8 — проверяет стиль кода (PEP 8), сложные конструкции, ошибки
          # . — проверяем всю текущую директорию
          poetry run flake8 .
          
          # mypy — проверяет аннотации типов (type hints)
          # Ищет несоответствия между объявленными и фактическими типами
          poetry run mypy .


  # ===========================================================================
  # JOB 2: TEST — Запуск тестов с измерением покрытия
  # ===========================================================================
  # Эта задача запускает юнит-тесты и измеряет, какой процент кода покрыт тестами.
  # Запускается ТОЛЬКО если задача lint прошла успешно (needs: lint).
  # ===========================================================================
  test:
    name: Test

    runs-on: ubuntu-latest

    # Зависимости — какие задачи должны завершиться успешно перед запуском этой
    needs: lint
    # Это означает: "Не запускать test, пока lint не завершится успешно"

    # Переменные окружения для тестов
    env:
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: false
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      # Шаг 1-4: Те же, что и в задаче lint
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
          cache: poetry

      - name: Install dependencies
        run: poetry install

      # Шаг 5: Применяем миграции базы данных
      - name: Run migrations
        run: poetry run python manage.py migrate

      # Шаг 6: Запускаем тесты с измерением покрытия
      - name: Run tests with coverage
        run: |
          # pytest — фреймворк для запуска тестов
          # --cov=. — измерить покрытие для текущей директории
          # --cov-report=xml — создать отчёт в формате XML (для Codecov)
          # --cov-report=html — создать HTML-отчёт (можно скачать и посмотреть)
          poetry run pytest --cov=. --cov-report=xml --cov-report=html

      # Шаг 7: Отправляем отчёт о покрытии в Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # fail_ci_if_error: false — не падать, если Codecov недоступен
          fail_ci_if_error: false
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}


  # ===========================================================================
  # JOB 3: BUILD — Сборка Docker-образа
  # ===========================================================================
  # Эта задача собирает Docker-образ проекта.
  # Запускается ТОЛЬКО если lint и test прошли успешно.
  # Запускается для ВЕТОК develop, main и feature/* (не для PR).
  # ===========================================================================
  build:
    name: Build Docker Image

    runs-on: ubuntu-latest

    # Зависимости — ждём завершения lint и test
    needs: [lint, test]

    # Условие — когда запускать эту задачу
    if: |
      github.ref == 'refs/heads/main' || 
      github.ref == 'refs/heads/develop' || 
      startsWith(github.ref, 'refs/heads/feature/')

    steps:
      # Шаг 1: Скачиваем код
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 3: Собираем Docker-образ
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max