# =============================================================================
# Deploy Pipeline — Continuous Deployment
# =============================================================================
# Этот файл отвечает за автоматический деплой проекта на сервер.
# Запускается только после успешного прохождения CI (тестов).
#
# Что делает:
# 1. Подключается к серверу по SSH
# 2. Обновляет код проекта из репозитория
# 3. Устанавливает зависимости через Poetry
# 4. Создаёт .env файл из GitHub Secrets
# 5. Применяет миграции базы данных
# 6. Собирает статические файлы
# 7. Перезапускает Gunicorn сервис
#
# Когда запускается:
# - Вручную из вкладки Actions (workflow_dispatch)
# - Автодеплой отключён: демо-сервер выключен, а секреты SSH нужно
#   настроить заново. После поднятия сервера можно вернуть push-триггер.
# =============================================================================

name: Deploy

# -----------------------------------------------------------------------------
# Триггеры — только ручной запуск
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:

# -----------------------------------------------------------------------------
# Jobs — задачи workflow
# -----------------------------------------------------------------------------
jobs:
  deploy:
    name: Deploy to Server

    runs-on: ubuntu-latest

    # Environment — окружение для деплоя (показывает статус в GitHub)
    environment:
      name: production

    steps:
      # -----------------------------------------------------------------------
      # Шаг 1: Скачиваем код из репозитория
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Шаг 2: Подключаемся к серверу по SSH и выполняем деплой
      # -----------------------------------------------------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: ${{ secrets.SSH_PORT }}

          script: |
            cd /var/www/sky_tbook
            
            if [ ! -d ".git" ]; then
              echo "First deploy — cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            else
              echo "Updating repository..."
              git fetch origin
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi
            
            echo "Installing dependencies with Poetry..."
            export PATH="$HOME/.local/bin:$PATH"
            poetry install --no-interaction --no-root
            
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."

              echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
              echo "DEBUG=${{ secrets.DEBUG }}" >> .env
              echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
              echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
              echo "DB_USER=${{ secrets.DB_USER }}" >> .env
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
              echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
              echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
              echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
            fi
            
            echo "Running database migrations..."
            poetry run python manage.py migrate --noinput
            
            echo "Collecting static files..."
            poetry run python manage.py collectstatic --noinput
            
            echo "Restarting Gunicorn service..."
            sudo systemctl daemon-reload
            sudo systemctl restart sky_tbook
            sudo systemctl status sky_tbook --no-pager
            
            echo "Checking Nginx status..."
            sudo systemctl status nginx --no-pager
            
            echo "✅ Deploy completed successfully!"

      # -----------------------------------------------------------------------
      # Шаг 3: Проверка здоровья (healthcheck)
      # -----------------------------------------------------------------------
      # Проверяем, что сервер отвечает после деплоя

      - name: Healthcheck
        env:
          # Задайте переменную репозитория APP_URL (Settings → Variables),
          # например https://example.com/. Без неё шаг пропускается.
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL не задан — healthcheck пропущен."
            exit 0
          fi
          # Делаем 10 попыток с интервалом 5 секунд.
          curl --retry 10 --retry-delay 5 --retry-connrefused -fsS "$APP_URL" \
            || echo "Healthcheck failed, but continuing..."
