<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>API Docs</title>
    <style>

        body {
          margin: 0;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background: #f5f5f5;
        }

        .container {
          text-align: center;
        }

        .btn {
          display: inline-block;
          padding: 12px 24px;
          margin: 8px;
          font-size: 16px;
          border-radius: 6px;
          border: none;
          cursor: pointer;
          text-decoration: none;
          color: #fff;
        }

        .btn-swagger {
          background-color: #3f51b5;
        }

        .btn-redoc {
          background-color: #009688;
        }

        .btn:hover {
          opacity: 0.9;
        }

    </style>
</head>
<body>
    <div class="container">
        <a class="btn btn-swagger" href="/api/schema/swagger/">Swagger UI</a>
        <a class="btn btn-redoc" href="/api/schema/redoc/">ReDoc</a>
    </div>
</body>
</html>
